name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  connectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate published connector schema
        run: |
          python -m pip install -r scripts/requirements-registry.txt
          python scripts/check-registry-schema.py
      - name: Telegram AT-SPI probe fake-tree checks
        run: python -B scripts/test-telegram-atspi-probe.py
      - name: Install synthetic Linux AT-SPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core libatk-adaptor xvfb dbus-x11
      - name: Telegram AT-SPI synthetic native-window transport
        env:
          NO_AT_BRIDGE: '0'
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/test-telegram-atspi-native.py
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Validate offline connector inventory
        run: cargo run --locked -p tgsum-core --bin connector-registry -- > connector-report.json
      - name: Upcoming connector reviews
        shell: bash
        run: |
          cargo run --locked -p tgsum-core --bin connector-registry -- --reminders --within-days 14 > connector-review.json
          python scripts/connector-review-summary.py connector-review.json | tee connector-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-inventory-report
          path: |
            connector-report.json
            connector-review.json
            connector-review.md
          if-no-files-found: error

  telegram-uia:
    name: Telegram UIA synthetic transport
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Telegram UIA probe fake-tree checks
        shell: powershell
        run: .\scripts\test-telegram-uia-probe.ps1
      - name: Telegram UIA synthetic native-window transport
        shell: powershell
        run: .\scripts\test-telegram-uia-native.ps1

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check.sh lint
      - name: Shell scripts
        run: shellcheck -s sh install.sh && shellcheck packaging/arch/build-local.sh scripts/check.sh scripts/build-relay.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check.sh test
      - name: Telegram AX probe synthetic checks
        if: runner.os == 'macOS'
        run: |
          swiftc scripts/telegram-ax-probe.swift -o "$RUNNER_TEMP/telegram-ax-probe"
          "$RUNNER_TEMP/telegram-ax-probe" --self-test

  desktop-e2e:
    name: desktop E2E (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebKitGTK and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev xvfb dbus-x11
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build opt-in synthetic desktop harness
        run: cargo build --locked -p tgsum --features desktop-e2e
      - name: Exercise actual Linux WebView
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a python scripts/desktop-e2e.py
      - name: Exercise actual native WebView
        if: runner.os != 'Linux'
        run: python scripts/desktop-e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: desktop-e2e-report/
          if-no-files-found: warn
          retention-days: 7

  # Build the pacman package and exercise the actual WebView against Arch's
  # WebKitGTK and Rust. Xvfb covers the Arch runtime; local Wayland is separate.
  arch:
    name: arch (Omarchy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:base-devel
    steps:
      - name: Install build and desktop test dependencies
        run: pacman -Syu --noconfirm --needed git rust cairo gdk-pixbuf2 glib2 gtk3 hicolor-icon-theme libsoup3 pango webkit2gtk-4.1 librsvg xdg-utils python dbus xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v4
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '*' && packaging/arch/build-local.sh --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: tgsum-arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
      - name: Build synthetic desktop harness with Arch Rust
        run: su builder -c 'cargo build --locked -p tgsum --features desktop-e2e'
      - name: Exercise actual Arch WebView as an unprivileged user
        run: |
          su builder -s /bin/bash <<'TGSUM_E2E'
          set -euo pipefail
          export GDK_BACKEND=x11
          tgsum_runtime=$(mktemp -d /tmp/tgsum-arch-runtime.XXXXXX)
          trap 'rm -rf "$tgsum_runtime"' EXIT
          export XDG_RUNTIME_DIR="$tgsum_runtime"
          dbus-run-session -- xvfb-run -a python scripts/desktop-e2e.py --report-dir desktop-e2e-report/arch
          TGSUM_E2E
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-arch
          path: desktop-e2e-report/arch/
          if-no-files-found: warn
          retention-days: 7
