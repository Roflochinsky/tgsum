[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Roflochinsky/tgsum"
homepage = "https://github.com/Roflochinsky/tgsum#readme"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
