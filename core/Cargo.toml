[package]
name = "tgsum-core"
description = "Telegram Desktop export (result.json) -> AI-ready Markdown: streaming parser, forum topics, formatter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["telegram", "markdown", "export", "parser", "llm"]
categories = ["parser-implementations", "text-processing"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
regex = "1"
base64 = "0.22"
hmac = "0.12"
getrandom = "0.3"
url = "2.5.8"
aho-corasick = "1.1.5"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
redb = "=2.6.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }
