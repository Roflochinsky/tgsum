[package]
name = "tgsum"
description = "Telegram export -> AI-ready Markdown, desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "tgsum_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tgsum-core = { path = "../core" }
# `custom-protocol` = always serve the embedded `ui/` (there is no dev server).
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tauri = { version = "2", features = ["custom-protocol", "test"] }
tempfile = "3"
