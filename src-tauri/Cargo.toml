[package]
name = "tgsum"
description = "Desktop app that turns a Telegram Desktop export (result.json) into clean Markdown for AI chats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["telegram", "markdown", "export", "llm", "tauri"]
categories = ["gui", "text-processing"]

[lints]
workspace = true

# A plain Rust library (for the integration tests); no mobile targets, so no
# staticlib/cdylib to link on every release build.
[lib]
name = "tgsum_app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tgsum-core.workspace = true
tgsum-runner = { path = "../runner", version = "0.2.0" }
# `custom-protocol` = always serve the embedded `ui/` (there is no dev server).
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[features]
# Debug-only local UI harness. Release code never enables the synthetic backend.
analysis-fixtures = []
# Real WebView smoke, enabled only by the explicit debug test launcher.
desktop-e2e = ["analysis-fixtures", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tauri = { version = "2", features = ["custom-protocol", "test"] }
tempfile = "3"
